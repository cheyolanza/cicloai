name: Deploy CicloAI to Google Cloud Run

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  PROJECT_ID: ciclo-ai
  REGION: us-central1
  ARTIFACT_REGISTRY_REPOSITORY: cicloai
  BACKEND_SERVICE: cicloai-backend
  FRONTEND_SERVICE: cicloai-frontend
  BACKEND_IMAGE: cicloai-backend
  FRONTEND_IMAGE: cicloai-frontend
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: "ciclo-ai:us-central1:cicloai-postgres"
  CLOUD_SQL_DATABASE: cicloai-db
  CLOUD_SQL_USER: cicloai_user
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-unit-test:
    name: Lint, Type Check and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./cicloai-backend/requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Lint Backend
        run: |
          cd cicloai-backend
          ruff check .

      - name: Type Check Backend
        run: |
          cd cicloai-backend
          mypy app || true

      - name: Unit Test Backend
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
          ENABLE_CAPTCHA_MOCK: "true"
          RECAPTCHA_ENABLE_MOCKS: "true"
          ENABLE_OCR_MOCK: "true"
          ENABLE_RAG_MOCK: "true"
          JWT_SECRET_KEY: test_secret_key
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_SECONDS: "3600"
          OPENAI_API_KEY: sk_test_key
          DATABASE_URL: "sqlite:///:memory:"
          CATEGORY_RULES_PDF_PATH: app/assets/documents/category_rules/convocatoria.txt
        run: |
          cd cicloai-backend
          pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  build-docker:
    name: Build Docker
    needs: lint-typecheck-unit-test
    runs-on: ubuntu-latest

    outputs:
      backend_image_uri: ${{ steps.images.outputs.backend_image_uri }}
      frontend_image_uri: ${{ steps.images.outputs.frontend_image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Define Image URIs
        id: images
        run: |
          BACKEND_IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${BACKEND_IMAGE}:${{ github.sha }}"
          FRONTEND_IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${FRONTEND_IMAGE}:${{ github.sha }}"

          echo "backend_image_uri=$BACKEND_IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "frontend_image_uri=$FRONTEND_IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build Backend Docker Image
        run: |
          docker build -t "${{ steps.images.outputs.backend_image_uri }}" ./cicloai-backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="https://${BACKEND_SERVICE}-674379443086.${REGION}.run.app/api/v1" \
            --build-arg VITE_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}" \
            -t "${{ steps.images.outputs.frontend_image_uri }}" \
            ./cicloai-frontend

      - name: Push Backend Docker Image
        run: docker push "${{ steps.images.outputs.backend_image_uri }}"

      - name: Push Frontend Docker Image
        run: docker push "${{ steps.images.outputs.frontend_image_uri }}"

  security-scan:
    name: Security Scan
    needs: build-docker
    runs-on: ubuntu-latest

    steps:
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-docker.outputs.backend_image_uri }}
          format: table
          exit-code: "0"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-docker.outputs.frontend_image_uri }}
          format: table
          exit-code: "0"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  deploy-to-cloud:
    name: Deploy to Cloud
    needs: [build-docker, security-scan]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy "${BACKEND_SERVICE}" \
            --image="${{ needs.build-docker.outputs.backend_image_uri }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8000 \
            --add-cloudsql-instances="${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --set-env-vars="^|^ENVIRONMENT=production|DB_NAME=${CLOUD_SQL_DATABASE}|DB_USER=${CLOUD_SQL_USER}|CLOUD_SQL_INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE_CONNECTION_NAME}|CORS_ALLOWED_ORIGINS=https://cicloai-frontend-674379443086.us-central1.run.app,https://cicloai.com,https://www.cicloai.com|GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/google-service-account.json" \
            --set-secrets="DB_PASSWORD=db-password:latest,JWT_SECRET_KEY=jwt-secret-key:latest,OPENAI_API_KEY=openai-api-key:latest,GOOGLE_RECAPTCHA_SECRET_KEY=google-recaptcha-secret-key:latest,/app/secrets/google-service-account.json=google-service-account-json:latest"

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image="${{ needs.build-docker.outputs.frontend_image_uri }}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=80