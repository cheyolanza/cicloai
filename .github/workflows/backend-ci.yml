name: backend-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint, tests and coverage
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      ENABLE_CAPTCHA_MOCK: "true"
      RECAPTCHA_ENABLE_MOCKS: "true"
      ENABLE_OCR_MOCK: "true"
      ENABLE_RAG_MOCK: "true"
      JWT_SECRET_KEY: test-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_SECONDS: "3600"
      DATABASE_URL: sqlite:///./test.db
      OPENAI_API_KEY: test-key
      CATEGORY_RULES_PDF_PATH: app/assets/documents/category_rules/convocatoria.txt
      STORAGE_DIR: /tmp/cicloai-ci-data
      PAYMENT_PROOFS_STORAGE_DIR: /tmp/cicloai-ci-payments
      PYTHONPATH: app/cicloai-backend/src
      COVERAGE_RCFILE: app/cicloai-backend/.coveragerc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/cicloai-backend/requirements.txt

      - name: Install dependencies
        working-directory: app/cicloai-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare test placeholders
        run: |
          mkdir -p app/assets/documents/category_rules
          mkdir -p app/assets/payments
          mkdir -p "$STORAGE_DIR" "$PAYMENT_PROOFS_STORAGE_DIR"
          if [ ! -f app/assets/documents/category_rules/convocatoria.txt ]; then
            printf '%s\n' 'Convocatoria de prueba para CI. Categorias: Federado Master A2.' > app/assets/documents/category_rules/convocatoria.txt
          fi
          touch app/assets/payments/.gitkeep

      - name: Run lint if configured
        run: |
          if grep -q '^\[tool\.ruff' app/cicloai-backend/pyproject.toml 2>/dev/null; then
            python -m pip install ruff
            ruff check app/cicloai-backend
          elif [ -f app/cicloai-backend/.flake8 ]; then
            python -m pip install flake8
            flake8 app/cicloai-backend
          else
            python -m compileall app/cicloai-backend/src app/cicloai-backend/tests
          fi

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
