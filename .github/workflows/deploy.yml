name: deploy-cloud-run

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  PROJECT_ID: ciclo-ai
  REGION: us-central1
  ARTIFACT_REGISTRY_REPOSITORY: cicloai
  BACKEND_SERVICE: cicloai-backend
  FRONTEND_SERVICE: cicloai-frontend
  BACKEND_IMAGE: cicloai-backend
  FRONTEND_IMAGE: cicloai-frontend
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: ciclo-ai:us-central1:cicloai-postgres
  CLOUD_SQL_DATABASE: cicloai-db
  CLOUD_SQL_USER: cicloai_user

jobs:
  deploy:
    name: Build, push and deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${BACKEND_IMAGE}:${{ github.sha }}"
          echo "Subiendo a: $IMAGE_URI"
          docker build -t "$IMAGE_URI" ./cicloai-backend
          docker push "$IMAGE_URI"

      - name: Deploy backend to Cloud Run
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        run: |
          gcloud run deploy "${BACKEND_SERVICE}" \
            --image="${IMAGE_URI}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8000 \
            --add-cloudsql-instances="${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --set-env-vars="ENVIRONMENT=production,DB_NAME=${CLOUD_SQL_DATABASE},DB_USER=${CLOUD_SQL_USER},INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE_CONNECTION_NAME},GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/google-service-account.json" \
            --set-secrets="DB_PASS=db-password:latest,JWT_SECRET_KEY=jwt-secret-key:latest,OPENAI_API_KEY=openai-api-key:latest,GOOGLE_RECAPTCHA_SECRET_KEY=google-recaptcha-secret-key:latest,/app/secrets/google-service-account.json=google-service-account-json:latest"

      - name: Read backend URL
        id: backend
        run: |
          BACKEND_URL="$(gcloud run services describe "${BACKEND_SERVICE}" --platform=managed --region="${REGION}" --format='value(status.url)')"
          echo "url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          BACKEND_URL: ${{ steps.backend.outputs.url }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${BACKEND_URL}/api/v1" \
            --build-arg VITE_RECAPTCHA_ENTERPRISE_SITE_KEY="${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}" \
            -t "${IMAGE_URI}" \
            ./cicloai-frontend
          docker push "${IMAGE_URI}"

      - name: Deploy frontend to Cloud Run
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image="${IMAGE_URI}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=80
